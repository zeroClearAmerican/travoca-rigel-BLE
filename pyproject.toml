[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travoca-rigel-ble"
version = "0.1.0"
description = "Control and telemetry for Travoca Rigel 12 V fridges over BLE"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "PolyForm-Noncommercial-1.0.0"}
keywords = ["ble", "bluetooth", "travoca", "iceco", "fridge", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = ["bleak>=1.0"]

[project.urls]
Homepage = "https://github.com/zeroClearAmerican/travoca-rigel-BLE"
Issues = "https://github.com/zeroClearAmerican/travoca-rigel-BLE/issues"

[project.optional-dependencies]
# devtools/ (relay, raw client): Linux + BlueZ only
dev = ["rich>=13", "dbus-fast>=2", "pytest>=8"]

[project.scripts]
travoca-rigel = "travoca_rigel.cli:main"

[tool.setuptools]
packages = ["travoca_rigel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
